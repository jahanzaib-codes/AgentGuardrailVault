[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

[rpc_endpoints]
base = "${BASE_RPC_URL:-https://mainnet.base.org}"
arbitrum = "${ARBITRUM_RPC_URL:-https://arb1.arbitrum.io/rpc}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}"

[fuzz]
runs = 256
